[project]
name = "api"
version = "0.1.0"
description = "Product API (FastAPI)"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.*",
    "uvicorn[standard]==0.54.*",
    "pydantic==2.14.*",
    "pydantic-settings==2.15.*",
    "sqlalchemy==2.1.*",
    "psycopg[binary]==3.3.*",
    "alembic==1.20.*",
    "argon2-cffi==25.1.*",
    "pyjwt==2.15.*",
    # Project screenshots: read the form (multipart) and convert to WebP.
    "python-multipart==0.0.32",
    "pillow==12.3.*",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.*",
    "pytest-cov==7.1.*",
    "httpx2==2.13.*",
    "ruff==0.17.*",
    "mypy==2.4.*",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# E/W: style, F: errors, I: import order, B: common bugs, UP: modern syntax,
# S: security (the Bandit rules, ADR (Architecture Decision Record) 0007).
select = ["E", "W", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.isort]
# The alembic/ folder (migrations) confuses ruff: the alembic package is external.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations import `sa` and `op` even though they don't always use them.
"alembic/versions/*.py" = ["F401"]
# In tests, `assert` is how checks are done and the passwords are fake.
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
