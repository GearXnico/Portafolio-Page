[project]
name = "api"
version = "0.1.0"
description = "API del producto (FastAPI)"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.*",
    "uvicorn[standard]==0.54.*",
    "pydantic==2.14.*",
    "pydantic-settings==2.15.*",
    "sqlalchemy==2.1.*",
    "psycopg[binary]==3.3.*",
    "alembic==1.20.*",
    "argon2-cffi==25.1.*",
    "pyjwt==2.15.*",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.*",
    "pytest-cov==7.1.*",
    "httpx2==2.13.*",
    "ruff==0.17.*",
    "mypy==2.4.*",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# E/W: estilo, F: errores, I: orden de imports, B: bugs comunes, UP: sintaxis moderna.
# Las reglas de seguridad (S, las de Bandit) llegan en la tarea 1.5.
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# La carpeta alembic/ (migraciones) confunde a ruff: el paquete alembic es externo.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Las migraciones generadas importan `sa` y `op` aunque no siempre los usen.
"alembic/versions/*.py" = ["F401"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
