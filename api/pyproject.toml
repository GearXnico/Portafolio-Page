[project]
name = "api"
version = "0.1.0"
description = "API del producto (FastAPI)"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.*",
    "uvicorn[standard]==0.54.*",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
