# Production and staging: database, migrations, API and Caddy.
# Reads the variables from deploy/.env, which is never committed to the repo (see deploy/README.md):
#   docker compose -f deploy/compose.prod.yml --env-file deploy/.env up -d --wait caddy
name: ${COMPOSE_PROJECT_NAME:-producto}

# Shared by all services: no root (each image or `user:`), no capabilities, no
# writing outside their volumes, and logs that rotate so they don't fill the disk.
x-base: &base
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  pids_limit: 200
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

# API and Caddy images. In CI they are built here; on the server they are pulled from
# GHCR by SHA with IMAGE_PREFIX=ghcr.io/<owner>/<repo> and IMAGE_TAG=<sha>.
x-api-image: &api-image
  image: ${IMAGE_PREFIX:-producto}/api:${IMAGE_TAG:-local}
  build: ../api

# Memory limits sized for a 1 GiB VM: they add up to 768 MiB and leave the rest to the system.
services:
  db:
    <<: *base
    image: postgres:18-alpine
    # The image's own user, without going through root (it doesn't need to switch users at startup).
    user: postgres
    tmpfs: [/tmp, /var/run/postgresql]
    mem_limit: 384m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      APP_DB_USER: ${APP_DB_USER:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    # No published ports: only the API and the migrations see it, over the internal network.
    volumes:
      - db-data:/var/lib/postgresql
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies the migrations and exits, before the API is replaced. The only one with the owner's password.
  migrate:
    <<: [*base, *api-image]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    mem_limit: 256m
    environment:
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: [*base, *api-image]
    mem_limit: 256m
    environment:
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      # Only Caddy, from the internal network below, can report the visitor's real IP.
      TRUSTED_PROXIES: 172.30.0.0/24
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CONTACT_NOTIFY_TO: ${CONTACT_NOTIFY_TO:-}
      # Required: without them the compose doesn't start, instead of leaving the panel without login.
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?}
      JWT_SECRET: ${JWT_SECRET:?}
      # Project screenshots, in the volume Caddy serves at /media.
      MEDIA_DIR: /media
    volumes:
      - media:/media
    healthcheck:
      # /api/health also queries the database.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    <<: *base
    image: ${IMAGE_PREFIX:-producto}/web:${IMAGE_TAG:-local}
    build:
      context: ../web
      additional_contexts:
        deploy: .
    mem_limit: 128m
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - media:/srv/media:ro
    depends_on:
      api:
        condition: service_healthy

# Fixed internal network, so TRUSTED_PROXIES doesn't change between deployments.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  db-data:
  media:
  caddy-data:
  caddy-config:
