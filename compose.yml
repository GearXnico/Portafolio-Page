# Local development: database, API and web with live reload.
# Production uses deploy/compose.prod.yml (see deploy/README.md).
name: ${COMPOSE_PROJECT_NAME:-producto}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # API user, with least privilege (created by db/init/01-api-user.sh).
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies the migrations and exits. It is the only service with the table owner's
  # password; it also runs the tests, which need to migrate the database.
  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./api/app:/code/app
      - ./api/alembic:/code/alembic
      - ./api/tests:/code/tests
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    environment:
      # Only the least-privilege user: the API doesn't know the owner's password.
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CONTACT_NOTIFY_TO: ${CONTACT_NOTIFY_TO:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api/app:/code/app
      # Project screenshots (MEDIA_DIR); in production Caddy mounts them too.
      - media:/code/media
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/code
      - /code/node_modules
    depends_on:
      - api

volumes:
  db-data:
  media:
