# Desarrollo local: base de datos, API y web con recarga en vivo.
# Producción usa deploy/compose.prod.yml (tarea 1.6 del plan).
name: ${COMPOSE_PROJECT_NAME:-producto}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Usuario de la API, con permisos mínimos (lo crea db/init/01-usuario-api.sh).
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    environment:
      # La API se conecta con el usuario de permisos mínimos; las migraciones, con el dueño.
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api/app:/code/app
      - ./api/alembic:/code/alembic
      - ./api/tests:/code/tests
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/code
      - /code/node_modules
    depends_on:
      - api

volumes:
  db-data:
