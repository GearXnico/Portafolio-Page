# Weekly dependency updates (ADR, architecture decision record, 0007). The PRs (pull requests) go through
# the same checks as any other and are not reviewed by the AI (artificial intelligence; ai-review.yml skips Dependabot).
# Minor and patch updates arrive in one PR per ecosystem; major ones, in a separate PR
# each, because they can break things and are best reviewed one by one.
# cooldown: waits 7 days after a version is released before proposing it, in case it was malicious
# and gets pulled. Dependabot security alerts don't wait.
version: 2

updates:
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      pip:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      npm:
        update-types: [minor, patch]

  # Base images of the Dockerfiles.
  - package-ecosystem: docker
    directories: [/api, /web]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      docker:
        update-types: [minor, patch]
    # Node only in LTS (long-term support) versions, the even ones. Odd versions last about 6
    # months and dependencies don't always accept them (PR #15 to Node 25 didn't build).
    # Patches of the LTS in use still arrive: the `24-alpine` tag is floating and Trivy checks
    # the image every week. New LTS versions (26, 28) are still proposed.
    # Add the next odd version (29.x) when it's due.
    ignore:
      - dependency-name: node
        versions: ["25.x", "27.x"]

  # Keeps the SHAs pinned in .github/workflows/ up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      actions:
        update-types: [minor, patch]
