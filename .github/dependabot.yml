# Actualizaciones semanales de dependencias (ADR 0007). Los PR pasan por los mismos checks
# que cualquier otro y no los revisa la IA (ai-review.yml se salta a Dependabot).
# Las actualizaciones menores y de parche llegan en un PR por ecosistema; las mayores, en un PR
# aparte cada una, porque pueden romper cosas y conviene revisarlas una a una.
# cooldown: espera 7 días desde que sale una versión antes de proponerla, por si era maliciosa y
# la retiran. Las alertas de seguridad de Dependabot no esperan.
version: 2

updates:
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      pip:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      npm:
        update-types: [minor, patch]

  # Imágenes base de los Dockerfile.
  - package-ecosystem: docker
    directories: [/api, /web]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      docker:
        update-types: [minor, patch]
    # Node solo en versiones LTS (soporte de largo plazo, las pares). Las impares duran unos 6
    # meses y las dependencias no siempre las aceptan (el PR #15 a Node 25 no construía).
    # Los parches de la LTS en uso llegan igual: la etiqueta `24-alpine` es flotante y Trivy revisa
    # la imagen cada semana. Las LTS nuevas (26, 28) se siguen proponiendo.
    # Agregar la siguiente impar (29.x) cuando corresponda.
    ignore:
      - dependency-name: node
        versions: ["25.x", "27.x"]

  # Mantiene al día los SHA fijados en .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      actions:
        update-types: [minor, patch]
