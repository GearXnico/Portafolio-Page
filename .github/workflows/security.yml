# Security checks for every PR, every push to dev and main, and once a week.
# The ruff security rules (S, the Bandit ones) run in the pre-commit job of ci.yml.
# Secret scanning and push protection are repo settings on GitHub, not part of this workflow.
name: security

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  # Mondays at 09:00 UTC, to catch new vulnerabilities even if nobody pushes.
  schedule:
    - cron: "0 9 * * 1"

# No permissions by default; each job asks only for what it uses.
permissions: {}

concurrency:
  # On a PR, a new push cancels the previous scan. On dev and main the group is the SHA of each
  # commit, so no scan is cancelled or discarded from the queue.
  group: seguridad-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # GitHub static analysis. The PR's "CodeQL" check fails on high or critical severity
  # findings (the repo's default threshold, in Settings > Code security).
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # actions checks the workflows themselves (injection in `run:`, excess permissions).
        language: [actions, python, javascript-typescript]
    steps:
      # Actions pinned by SHA so that a moved tag can't change the code that runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          # None of the three languages needs a build for the analysis.
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

  # Known vulnerabilities in the Python dependencies, including the development ones.
  # pip-audit doesn't filter by severity: it fails on any known vulnerability.
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]" "pip-audit==2.10.*"
      # --skip-editable: the `api` package is this repo, it is not published on PyPI.
      - run: pip-audit --skip-editable

  # High or critical vulnerabilities in the web dependencies. It reads only package-lock.json.
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm audit --audit-level=high

  # Trivy on the production images: high or critical vulnerabilities that already have a
  # fix. It doesn't check postgres:18-alpine, which isn't built here; its findings are in
  # gosu, which never runs because compose.prod.yml starts the database as the postgres user.
  trivy:
    name: Trivy (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The web one is Caddy with the page build, and it takes the Caddyfile from deploy/.
      - name: Build the image
        env:
          IMAGE: ${{ matrix.image }}
        run: docker build -t "producto-$IMAGE:ci" --build-context deploy=deploy "$IMAGE"
      # v0.36.0 is newer than the compromise of this action's tags (March 2026), and the pinned
      # SHA keeps a moved tag from changing what runs.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: producto-${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # Findings accepted one by one, with an expiry date: a new CVE still fails.
          trivyignores: .trivyignore
