# After every push to main, rebases dev onto main and publishes it with a force push. ADR (architecture decision record) 0007.
# Rebase & merge copies the commits to main with a different SHA; without this, the next release PR (pull request)
# would show repeated commits. Git drops the ones already in main and keeps the new ones.
# It uses the deploy key from the SYNC_DEV_SSH_KEY secret, the only exception in the dev ruleset.
name: sync-dev

on:
  push:
    branches: [main]

permissions: {}

# Two releases in a row are synced in order, without cancelling the previous one.
concurrency:
  group: sync-dev
  cancel-in-progress: false

jobs:
  sync:
    name: Rebase dev onto main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          ssh-key: ${{ secrets.SYNC_DEV_SSH_KEY }}

      # If the rebase conflicts (for example, a hotfix that touches the same code as dev), the job
      # fails without publishing anything and the conflict is resolved by hand on a branch.
      - name: Rebase and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rebase origin/main
          git push --force-with-lease=dev:origin/dev origin HEAD:dev
