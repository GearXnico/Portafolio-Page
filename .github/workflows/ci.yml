# Tests for every PR (pull request) and every push to dev and main. ADR (architecture decision record) 0007.
# The five jobs run in parallel. It uses no secrets, so it is just as safe on PRs from forks.
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# No permissions by default; each job asks only to read the code.
permissions: {}

# A new push to the same PR cancels the previous run; on dev and main every commit finishes its CI (continuous integration).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Argon2 hash of the E2E (end-to-end) test admin's password, computed inside the API image.
  # The password comes through the E2E_ADMIN_PASSWORD variable (not as an argument, which shows in `ps`).
  HASH_PY: "import os; from argon2 import PasswordHasher; print(PasswordHasher().hash(os.environ['E2E_ADMIN_PASSWORD']))"

jobs:
  # ruff (lint and format), Prettier and private key detection, same as the local hook.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Actions pinned by SHA (commit hash) so that a moved tag can't change the code that runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install "pre-commit==4.6.*"
      - run: pre-commit run --all-files --show-diff-on-failure

  # mypy and pytest against the compose Postgres (with the least-privilege user from db/init/).
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Example passwords, only for the runner's throwaway database. The API reads them from ../.env.
      - name: Start the database
        run: cp ../.env.example ../.env && docker compose up -d --wait db
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy app
      - name: pytest (minimum coverage 80 %)
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=80

  # ESLint, tsc, Vitest with minimum coverage (80 %, in vite.config.ts) and build.
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Vitest (minimum coverage 80 %)
        run: npm run test:coverage
      - run: npm run build

  # Playwright against the page on `npm run dev`, with the compose API and database behind it.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Test admin for the panel E2E tests, with a random password on every run.
      - name: Start the database, migrations and API
        run: |
          cp ../.env.example ../.env
          docker compose build api
          export E2E_ADMIN_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$E2E_ADMIN_PASSWORD"
          hash=$(docker compose run --rm --no-deps -T -e E2E_ADMIN_PASSWORD api python -c "$HASH_PY")
          {
            echo "ADMIN_EMAIL=e2e@example.com"
            echo "ADMIN_PASSWORD_HASH='$hash'"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } >> ../.env
          echo "E2E_ADMIN_EMAIL=e2e@example.com" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          docker compose up -d --build --wait api
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

  # Deployment test: the production compose on the runner, with backup and migrations as on
  # the server, and the E2E tests against Caddy (headers and CSP, Content Security Policy, included).
  # It is the ephemeral staging of every PR (ADR 0008).
  deploy-check:
    name: Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      COMPOSE: docker compose -f deploy/compose.prod.yml --env-file deploy/.env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Example and test passwords, only for the runner's throwaway database. The variables
      # that .env.example leaves empty and production requires go at the end (the last one wins).
      # The panel E2E test admin gets a random password on every run. The hash is computed
      # with the already built image, so a placeholder goes first.
      - name: Build the production images and start the database
        run: |
          cp .env.example deploy/.env
          {
            echo "SITE_ADDRESS=http://localhost"
            echo "ADMIN_EMAIL=e2e@example.com"
            echo "ADMIN_PASSWORD_HASH=provisorio"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } >> deploy/.env
          $COMPOSE build
          export E2E_ADMIN_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$E2E_ADMIN_PASSWORD"
          hash=$($COMPOSE run --rm --no-deps -T -e E2E_ADMIN_PASSWORD api python -c "$HASH_PY")
          echo "ADMIN_PASSWORD_HASH='$hash'" >> deploy/.env
          echo "E2E_ADMIN_EMAIL=e2e@example.com" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          $COMPOSE up -d --wait db
      - name: Back up before migrating
        run: |
          $COMPOSE exec -T db pg_dump -U app -d app --format=custom > respaldo.dump
          $COMPOSE exec -T db pg_restore --list < respaldo.dump > /dev/null
      - name: Migrations, API and Caddy
        run: $COMPOSE up -d --wait caddy
      - name: No container runs as root
        run: |
          for service in db api caddy; do
            uid=$($COMPOSE exec -T "$service" id -u)
            echo "$service: uid $uid"
            test "$uid" != 0
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost
      - name: Compose logs on failure
        if: failure()
        run: $COMPOSE logs --no-color
