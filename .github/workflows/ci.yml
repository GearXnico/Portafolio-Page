# Pruebas de cada PR (pull request) y de cada push a dev y main. ADR 0007.
# Los cuatro jobs corren en paralelo. No usa secretos, así que es igual de seguro en PR desde forks.
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Sin permisos por defecto; cada job pide solo leer el código.
permissions: {}

# Un push nuevo al mismo PR cancela la corrida anterior; en dev y main cada commit termina su CI.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ruff (lint y formato), Prettier y detección de llaves privadas, igual que el hook local.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Acciones fijadas por SHA (hash del commit) para que un tag movido no cambie el código que corre.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install "pre-commit==4.6.*"
      - run: pre-commit run --all-files --show-diff-on-failure

  # mypy y pytest contra el Postgres del compose (con el usuario de permisos mínimos de db/init/).
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Claves de ejemplo, solo para la base desechable del runner. La API las lee de ../.env.
      - name: Levantar la base
        run: cp ../.env.example ../.env && docker compose up -d --wait db
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy app
      - name: pytest (cobertura mínima 80 %)
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=80

  # ESLint, tsc, Vitest con cobertura mínima (60 %, en vite.config.ts) y build.
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Vitest (cobertura mínima 60 %)
        run: npm run test:coverage
      - run: npm run build

  # Playwright contra la página en `npm run dev`, con la API y la base del compose detrás.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Levantar la base, las migraciones y la API
        run: cp ../.env.example ../.env && docker compose up -d --build --wait api
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Logs del compose si falla
        if: failure()
        run: docker compose logs --no-color
