# Pruebas de cada PR (pull request) y de cada push a dev y main. ADR 0007.
# Los cinco jobs corren en paralelo. No usa secretos, así que es igual de seguro en PR desde forks.
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Sin permisos por defecto; cada job pide solo leer el código.
permissions: {}

# Un push nuevo al mismo PR cancela la corrida anterior; en dev y main cada commit termina su CI.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Hash Argon2 de la clave del admin de prueba de los E2E, calculado dentro de la imagen de la API.
  # La clave llega por la variable E2E_ADMIN_PASSWORD (no como argumento, que se ve en `ps`).
  HASH_PY: "import os; from argon2 import PasswordHasher; print(PasswordHasher().hash(os.environ['E2E_ADMIN_PASSWORD']))"

jobs:
  # ruff (lint y formato), Prettier y detección de llaves privadas, igual que el hook local.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Acciones fijadas por SHA (hash del commit) para que un tag movido no cambie el código que corre.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.14-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install "pre-commit==4.6.*"
      - run: pre-commit run --all-files --show-diff-on-failure

  # mypy y pytest contra el Postgres del compose (con el usuario de permisos mínimos de db/init/).
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Claves de ejemplo, solo para la base desechable del runner. La API las lee de ../.env.
      - name: Levantar la base
        run: cp ../.env.example ../.env && docker compose up -d --wait db
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy app
      - name: pytest (cobertura mínima 80 %)
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=80

  # ESLint, tsc, Vitest con cobertura mínima (80 %, en vite.config.ts) y build.
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Vitest (cobertura mínima 80 %)
        run: npm run test:coverage
      - run: npm run build

  # Playwright contra la página en `npm run dev`, con la API y la base del compose detrás.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Admin de prueba para los E2E del panel, con una clave al azar en cada corrida.
      - name: Levantar la base, las migraciones y la API
        run: |
          cp ../.env.example ../.env
          docker compose build api
          export E2E_ADMIN_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$E2E_ADMIN_PASSWORD"
          hash=$(docker compose run --rm --no-deps -T -e E2E_ADMIN_PASSWORD api python -c "$HASH_PY")
          {
            echo "ADMIN_EMAIL=e2e@example.com"
            echo "ADMIN_PASSWORD_HASH='$hash'"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } >> ../.env
          echo "E2E_ADMIN_EMAIL=e2e@example.com" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          docker compose up -d --build --wait api
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Logs del compose si falla
        if: failure()
        run: docker compose logs --no-color

  # Prueba del despliegue: el compose de producción en el runner, con respaldo y migraciones como
  # en el servidor, y el E2E contra Caddy (cabeceras y CSP incluidas). Es el staging efímero de
  # cada PR (ADR 0008).
  deploy-check:
    name: Despliegue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      COMPOSE: docker compose -f deploy/compose.prod.yml --env-file deploy/.env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Claves de ejemplo y de prueba, solo para la base desechable del runner. Las variables
      # que .env.example deja vacías y producción exige van al final (gana la última).
      # El admin de prueba de los E2E del panel lleva una clave al azar en cada corrida. El hash
      # se calcula con la imagen ya construida, así que primero va uno provisorio.
      - name: Construir las imágenes de producción y levantar la base
        run: |
          cp .env.example deploy/.env
          {
            echo "SITE_ADDRESS=http://localhost"
            echo "ADMIN_EMAIL=e2e@example.com"
            echo "ADMIN_PASSWORD_HASH=provisorio"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } >> deploy/.env
          $COMPOSE build
          export E2E_ADMIN_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$E2E_ADMIN_PASSWORD"
          hash=$($COMPOSE run --rm --no-deps -T -e E2E_ADMIN_PASSWORD api python -c "$HASH_PY")
          echo "ADMIN_PASSWORD_HASH='$hash'" >> deploy/.env
          echo "E2E_ADMIN_EMAIL=e2e@example.com" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          $COMPOSE up -d --wait db
      - name: Respaldo antes de migrar
        run: |
          $COMPOSE exec -T db pg_dump -U app -d app --format=custom > respaldo.dump
          $COMPOSE exec -T db pg_restore --list < respaldo.dump > /dev/null
      - name: Migraciones, API y Caddy
        run: $COMPOSE up -d --wait caddy
      - name: Ningún contenedor corre como root
        run: |
          for service in db api caddy; do
            uid=$($COMPOSE exec -T "$service" id -u)
            echo "$service: uid $uid"
            test "$uid" != 0
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost
      - name: Logs del compose si falla
        if: failure()
        run: $COMPOSE logs --no-color
